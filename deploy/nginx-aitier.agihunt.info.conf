# aitier.agihunt.info —— AI 天梯（静态站）。Cloudflare DNS：A aitier → 172.245.159.112（claw），橙云代理；zone SSL 模式 Full，源站用自签证书（与 k3 等子域一致）
server {
    listen 80;
    listen [::]:80;
    server_name aitier.agihunt.info;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aitier.agihunt.info;

    ssl_certificate     /etc/ssl/certs/aitier.agihunt.info.crt;
    ssl_certificate_key /etc/ssl/private/aitier.agihunt.info.key;

    root /var/www/aitier.agihunt.info;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on; gzip_vary on; gzip_comp_level 6; gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 带 hash 的构建产物与字体长缓存
    location ^~ /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location ^~ /fonts/  { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }
    # 入口页不缓存，发新一期后立即生效
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }

    location ~ /\. { deny all; access_log off; log_not_found off; }

    access_log /var/log/nginx/aitier.access.log;
    error_log  /var/log/nginx/aitier.error.log;
}
