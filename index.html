<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020208" />
    <title>AI 天梯 · 全球大模型天梯榜</title>
    <meta name="description" content="3D 交互式 AI 模型天梯榜：LLM / 图像 / 视频三大类，SSS 到 E 八档，数据来自 LMArena、Artificial Analysis 与 AGI HUNT。" />
      <style>
      html, body { margin: 0; height: 100%; background: #020208; }
      .boot-splash { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 18px;
        background: radial-gradient(ellipse at 50% 110%, #2a0b3d 0%, #07061a 50%, #020208 85%); color: #eef0ff;
        font: 700 14px/1 -apple-system, "PingFang SC", sans-serif; letter-spacing: .5em; }
      .boot-splash svg { filter: drop-shadow(0 0 18px rgba(255, 79, 216, .6)); animation: bs 1.6s ease-in-out infinite; }
      .boot-splash__t { opacity: .7; padding-left: .5em; }
      .boot-splash__bar { width: 140px; height: 2px; background: rgba(255,255,255,.1); overflow: hidden; border-radius: 1px; }
      .boot-splash__bar i { display: block; width: 40%; height: 100%; background: linear-gradient(90deg, #ff4fd8, #4dabf7); animation: bb 1.1s ease-in-out infinite; }
      @keyframes bs { 50% { transform: translateY(-6px); } }
      @keyframes bb { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- 首屏占位：JS 还没下载完时立即显示，React 挂载后自动替换 -->
      <div class="boot-splash">
        <svg viewBox="0 0 64 64" width="64" height="64"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4fd8"/><stop offset=".5" stop-color="#b26bff"/><stop offset="1" stop-color="#4dabf7"/></linearGradient></defs><path d="M32 8 L54 54 H10 Z" fill="none" stroke="url(#bg)" stroke-width="4" stroke-linejoin="round"/><path d="M20 42h24M24 32h16M28 22h8" stroke="url(#bg)" stroke-width="3.5" stroke-linecap="round"/></svg>
        <div class="boot-splash__t">AI TIER</div>
        <div class="boot-splash__bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
